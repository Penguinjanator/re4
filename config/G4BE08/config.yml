name: main
# main.dol with the shared .ctors/.dtors DOL section split in two (tools/dol_sections.py split ... 0x8021C9E0)
object: sys/main_split.dol
object_base: orig/G4BE08
extract_objects: true
symbols: config/G4BE08/symbols.txt
splits: config/G4BE08/splits.txt
detect_objects: true
detect_strings: true
write_asm: true
symbols_known: true
fill_gaps: true
# SN Systems ProDG debugger stub (ppcdown/fileserver/proview/tealeaf): hand-written asm with computed jumps
skip_cfa_ranges:
- start: .text:0x80062A60
  end: .text:0x800659AC
# REL modules (tools/gen_rel_config.py writes config/G4BE08/modules/<name>/{splits.txt,symbols.txt,rel.json}).
# em27 (module 16) and em3e (module 94) live inside em/em27.drs and em/em3e.drs on the disc; the loose
# RELs import them (st1_1 -> em27, st2_* -> em3e), so they are extracted (tools/extract_drs_rel.py).
modules:
- object: files/Rel/Sscrn.rel
  name: Sscrn
  splits: config/G4BE08/modules/Sscrn/splits.txt
  symbols: config/G4BE08/modules/Sscrn/symbols.txt
- object: files/Rel/Tools.rel
  name: Tools
  splits: config/G4BE08/modules/Tools/splits.txt
  symbols: config/G4BE08/modules/Tools/symbols.txt
