name: main
# main.dol with the shared .ctors/.dtors DOL section split in two (tools/dol_sections.py split ... 0x8021C9E0)
object: sys/main_split.dol
object_base: orig/G4BE08
extract_objects: true
symbols: config/G4BE08/symbols.txt
splits: config/G4BE08/splits.txt
detect_objects: true
detect_strings: true
write_asm: true
symbols_known: true
fill_gaps: true
# SN Systems ProDG debugger stub (ppcdown/fileserver/proview/tealeaf): hand-written asm with computed jumps
skip_cfa_ranges:
- start: .text:0x80062A60
  end: .text:0x800659AC
# REL modules (tools/gen_rel_config.py writes config/G4BE08/modules/<name>/{splits.txt,symbols.txt,rel.json}).
# files/Rel/*.rel are loose on the disc; files/em/<name>.rel is the REL inside files/em/<name>.drs
# (tools/drs.py; tools/extract_orig.py pulls all of them from the image). 27 more archives hold a
# byte-identical copy of a REL listed here (em46/56/66 = em16, em4c/5c/6c = em1c, em4d/5d/6d = em1d,
# em4f/5f/6f = em1f, em50/60/70 = em20, pl0b/pl0c = pl02, pl15 = pl11, wep03/18 = wep02, wep20 = wep11,
# wep21/24 = wep09, wep25 = wep14, wep31/32 = wep10, wep46 = wep13); pl00/01/03/04/05/07/08/09/10/12/21
# have no REL.
modules:
